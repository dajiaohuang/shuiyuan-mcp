name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:package

  windows-launchers:
    runs-on: windows-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: pnpm install --frozen-lockfile
      - name: Build Windows launchers
        shell: pwsh
        run: .\scripts\build-shuiyuan-exe.ps1
      - name: Smoke test Windows launcher
        shell: pwsh
        run: |
          $start = Resolve-Path .\dist-win\shuiyuan-mcp.exe
          $login = Resolve-Path .\dist-win\shuiyuan-mcp-login.exe
          if (-not (Test-Path $start) -or -not (Test-Path $login)) {
            throw "Expected both Windows launchers to be built."
          }
          $missingProfile = Join-Path $env:RUNNER_TEMP "missing-shuiyuan-profile.json"
          $process = Start-Process -FilePath $start -ArgumentList @("--profile", $missingProfile) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 1) {
            throw "Expected the launcher to propagate exit code 1 for a missing profile; got $($process.ExitCode)."
          }

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - lint
      - windows-launchers
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create and push git tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --tags origin | grep -q "refs/tags/v${VERSION}$"; then
            echo "Tag v${VERSION} already exists, skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"
          fi
      - name: Publish package
        run: pnpm publish -r --no-git-checks || echo "Version already published, skipping"
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Sync server.json version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node -e "const fs = require('fs'); const s = JSON.parse(fs.readFileSync('server.json')); s.version = '$VERSION'; s.packages[0].version = '$VERSION'; fs.writeFileSync('server.json', JSON.stringify(s, null, 2) + '\n')"
      - name: Publish server to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
